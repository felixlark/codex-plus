name: CodexMobile
options:
  bundleIdPrefix: me.longbiaochen.codex-plus
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: HJG65XBC25
    CODE_SIGN_ENTITLEMENTS: ${CODEX_PLUS_SOURCE_ROOT}/mobile/iOS/CodexMobile.entitlements
targets:
  CodexMobile:
    type: application
    platform: iOS
    info:
      path: CodexMobile-Info.plist
      properties:
        CFBundleDisplayName: Codex Mobile
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    sources:
      - path: ${CODEX_PLUS_SOURCE_ROOT}/Sources/CodexPlusCore/MobileBootstrapScript.swift
      - path: ${CODEX_PLUS_SOURCE_ROOT}/mobile/iOS
      - path: ${CODEX_PLUS_SOURCE_ROOT}/mobile/Shared/MobileAddress.swift
      - path: ${CODEX_PLUS_MOBILE_CACHE}/frontend
        type: folder
        buildPhase: resources
      - path: ${CODEX_PLUS_MOBILE_CACHE}/mobile-preload.js
      - path: ${CODEX_PLUS_MOBILE_CACHE}/connection.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.longbiaochen.codex-plus.mobile
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 53
