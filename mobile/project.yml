name: CodexMobile
options:
  bundleIdPrefix: me.longbiaochen.codex-plus
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Codex Mobile
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  CodexMobile:
    type: application
    platform: iOS
    sources:
      - path: ${CODEX_PLUS_SOURCE_ROOT}/mobile/iOS
      - path: ${CODEX_PLUS_SOURCE_ROOT}/mobile/Shared/MobileStateKeys.json
        buildPhase: resources
      - path: ${CODEX_PLUS_SOURCE_ROOT}/mobile/Shared/MobileAddress.swift
      - path: ${CODEX_PLUS_MOBILE_CACHE}/frontend
        type: folder
        buildPhase: resources
      - path: ${CODEX_PLUS_MOBILE_CACHE}/mobile-preload.js
      - path: ${CODEX_PLUS_MOBILE_CACHE}/connection.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.longbiaochen.codex-plus.mobile
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 33
